# Configuration Railway pour NionFar API
# Ce fichier définit les options de déploiement pour Railway

build:
  dockerfile: Dockerfile

# Configuration du déploiement
deploy:
  # Environnement de déploiement
  numReplicas: 1
  sleepApplication: false
  restartPolicyType: on-failure
  restartPolicyMaxRetries: 10

  # Configuration des healthchecks
  healthcheckPath: /health
  healthcheckTimeout: 5s
  healthcheckInterval: 15s

  # Stratégie de mise à jour
  strategy: rolling

# Variables d'environnement communes
env:
  # Activation du mode Railway
  - key: RAILWAY_DEPLOYMENT
    value: "true"
  
  # Configuration de l'optimisation mémoire
  - key: MEMORY_OPTIMIZED
    value: "true" 