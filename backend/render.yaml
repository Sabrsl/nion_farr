services:
  - type: web
    name: nionfar-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: nionfar-mongodb
    databaseName: nionfar
    user: nionfar 