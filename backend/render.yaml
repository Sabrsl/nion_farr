services:
  - type: web
    name: nionfar-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Configure this in Render dashboard
      - key: APP_URL
        value: https://nionfar-backend.onrender.com
      - key: FRONTEND_URL
        value: https://nion-farr.vercel.app
      - key: PORT
        value: 3001
      - key: IS_RENDER
        value: true
      - key: API_PREFIX
        value: api
      - key: CORS_ALLOWED_ORIGINS
        value: https://nion-farr.vercel.app,https://www.nion-farr.vercel.app,http://localhost:3000
      - key: DB_HOST
        value: clusternionfar.rjuvvf7.mongodb.net
      - key: DB_PORT
        value: 27017
      - key: DB_USERNAME
        value: vynalapp
      - key: DB_DATABASE
        value: nionfar
      - key: DB_AUTH_SOURCE
        value: admin
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MEMORY_OPTIMIZED
        value: true
      - key: LOG_LEVEL
        value: info
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_SECURE
        value: true
      - key: MAIL_USER
        value: resend
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: NionFar
      - key: TWO_FACTOR_AUTHENTICATION_APP_NAME
        value: NionFar
      - key: PASSWORD_SALT_ROUNDS
        value: 10
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      # Variables sensibles à configurer dans le dashboard Render
      # - key: JWT_SECRET
      # - key: JWT_REFRESH_SECRET
      # - key: DB_PASSWORD
      # - key: MAIL_PASSWORD
      # - key: RESEND_API_KEY
      # - key: SENDGRID_API_KEY
      # - key: WAVE_API_KEY
      # - key: WAVE_API_SECRET
      # - key: ORANGE_MONEY_API_KEY
      # - key: ORANGE_MONEY_API_SECRET
      # - key: FREE_MONEY_API_KEY
      # - key: FREE_MONEY_API_SECRET
      # - key: TWILIO_ACCOUNT_SID
      # - key: TWILIO_AUTH_TOKEN
      # - key: TWILIO_PHONE_NUMBER
    autoDeploy: true
    plan: free
