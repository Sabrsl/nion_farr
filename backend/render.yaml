services:
  - type: web
    name: nionfar-backend
    env: node
    rootDir: nionfar/backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    region: frankfurt
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: MONGODB_URI
        fromDatabase:
          name: nionfar-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://nion-farr.vercel.app
      - key: APP_URL
        sync: false
      - key: ADDITIONAL_CORS_ORIGINS
        value: https://nion-farr.vercel.app,https://*.vercel.app
      - key: TWO_FACTOR_AUTHENTICATION_APP_NAME
        value: NionFar
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USER
        value: resend
      - key: MAIL_PASSWORD
        value: re_a4PMNnRv_AByeDNM1QaHhFqWcHFrB5h2Q
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: NionFar
      - key: MAIL_SECURE
        value: "true"
      - key: CSP_ENABLED
        value: "true"
      - key: HSTS_ENABLED
        value: "true"

databases:
  - name: nionfar-mongodb
    databaseName: nionfar
    user: nionfar 