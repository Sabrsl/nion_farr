services:
  - type: web
    name: nion-farr-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && chmod +x render-build.sh && ./render-build.sh
    startCommand: cd backend && NODE_OPTIONS="--max-old-space-size=1024" node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: api
      - key: APP_URL
        value: https://nionfar-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nion-farr.vercel.app
      - key: DB_AUTH_SOURCE
        value: admin
      - key: DB_DATABASE
        value: nionfar
      - key: DB_HOST
        value: clusternionfar.rjuvvf7.mongodb.net
      - key: DB_PORT
        value: 27017
      - key: DB_USERNAME
        value: vynalapp
      - key: EMAIL_LOGO_URL
        value: https://vynalapp.com/logo.png
      - key: EMAIL_SENDER
        value: Nionfar <onboarding@resend.dev>
      - key: FRONTEND_URL
        value: https://nion-farr.vercel.app
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MAIL_FROM
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: NionFar
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_SECURE
        value: true
      - key: MAIL_USER
        value: resend
      - key: NEXT_PUBLIC_BASE_URL
        value: https://nionfar.sn
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      - key: ORANGE_MONEY_API_URL
        value: https://api.orange.com
      - key: WAVE_API_URL
        value: https://api.wave.com
      - key: WEBSITE_URL
        value: https://vynalapp.com
      - key: RESEND_API_KEY
        value: re_a4PMNnRv_AByeDNM1QaHhFqWcHFrB5h2Q
      # Variables sensibles à configurer manuellement sur Render
      - key: MONGODB_URI
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FREE_MONEY_API_KEY
        sync: false
      - key: FREE_MONEY_API_SECRET
        sync: false
      - key: FREE_MONEY_API_URL
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ORANGE_MONEY_API_KEY
        sync: false
      - key: ORANGE_MONEY_API_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_API_SECRET
        sync: false
      - key: WAVE_SECRET_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true 