services:
  - type: web
    name: nionfar-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && NODE_OPTIONS="--max-old-space-size=128" MEMORY_OPTIMIZED=true node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        fromDatabase:
          name: nionfar-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400
      - key: REFRESH_TOKEN_EXPIRATION
        value: 604800
      - key: MEMORY_OPTIMIZED
        value: true
      - key: IS_RENDER
        value: true
      - key: DISABLE_USER_SYNC
        value: true
    healthCheckPath: /health

databases:
  - name: nionfar-db
    plan: free
    region: frankfurt 