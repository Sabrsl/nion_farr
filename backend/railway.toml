[build]
builder = "nixpacks"
buildCommand = "npm install --no-audit && npm run build"

[deploy]
startCommand = "npm run start:railway"
healthcheckPath = "/health/ping"
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"
healthcheckInterval = 10

[environments]
NODE_ENV = "production"
PORT = "8080" 