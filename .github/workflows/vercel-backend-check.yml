name: Vercel Backend Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  verify-vercel-backend:
    name: 🔧 Vérification Backend Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: 📦 Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: 🧪 Run linting and tests
        working-directory: backend
        run: |
          echo "🧹 Linting..."
          npm run lint || echo "⚠️ Linting issues trouvés"
          
          echo "🧪 Tests..."
          npm test || echo "⚠️ Des tests ont échoué"
      
      - name: 🛠️ Build Backend
        working-directory: backend
        run: |
          echo "🔨 Construction pour Vercel..."
          npm run build
          echo "✅ Build terminé"
      
      - name: 📊 Analyser le build
        working-directory: backend
        run: |
          # Vérifier la structure du build
          if [ ! -d "dist" ]; then
            echo "❌ Build dist manquant"
            exit 1
          fi
          
          # Statistiques simples
          TOTAL_SIZE=$(du -sh dist | cut -f1)
          JS_COUNT=$(find dist -name "*.js" | wc -l)
          
          echo "📊 Statistiques du build:"
          echo "- Taille totale: $TOTAL_SIZE"
          echo "- Fichiers JS: $JS_COUNT"
          
          # Vérifier la présence du point d'entrée Vercel
          if [ ! -d "api" ]; then
            echo "⚠️ Répertoire api/ manquant pour Vercel"
            echo "📝 Création du point d'entrée Vercel..."
            mkdir -p api
            
            # Créer le fichier index.js pour Vercel serverless
            echo "// API entry point pour Vercel" > api/index.js
            echo "const { app } = require('../dist/server');" >> api/index.js
            echo "" >> api/index.js
            echo "// Exporter le point d'entrée serverless" >> api/index.js
            echo "module.exports = app;" >> api/index.js
            
            echo "✅ api/index.js créé"
          fi
          
          # Vérifier vercel.json
          if [ ! -f "vercel.json" ]; then
            echo "⚠️ vercel.json manquant"
            echo "Création d'un fichier vercel.json de base..."
            
            # Créer le fichier vercel.json
            echo '{' > vercel.json
            echo '  "version": 2,' >> vercel.json
            echo '  "builds": [' >> vercel.json
            echo '    {' >> vercel.json
            echo '      "src": "api/index.js",' >> vercel.json
            echo '      "use": "@vercel/node"' >> vercel.json
            echo '    }' >> vercel.json
            echo '  ],' >> vercel.json
            echo '  "routes": [' >> vercel.json
            echo '    {' >> vercel.json
            echo '      "src": "/api/(.*)",' >> vercel.json
            echo '      "dest": "api/index.js"' >> vercel.json
            echo '    },' >> vercel.json
            echo '    {' >> vercel.json
            echo '      "src": "/(.*)",' >> vercel.json
            echo '      "dest": "api/index.js"' >> vercel.json
            echo '    }' >> vercel.json
            echo '  ],' >> vercel.json
            echo '  "env": {' >> vercel.json
            echo '    "NODE_ENV": "production",' >> vercel.json
            echo '    "APP_URL": "https://nion-farr-backend.vercel.app",' >> vercel.json
            echo '    "FRONTEND_URL": "https://nion-farr.vercel.app",' >> vercel.json
            echo '    "PORT": "3001",' >> vercel.json
            echo '    "CORS_ALLOWED_ORIGINS": "https://nion-farr.vercel.app,https://nion-farr-backend.vercel.app"' >> vercel.json
            echo '  }' >> vercel.json
            echo '}' >> vercel.json
            
            echo "✅ vercel.json créé"
          else
            # Vérifier les configurations clés
            if ! grep -q "nion-farr.vercel.app" vercel.json; then
              echo "⚠️ Frontend URL manquante dans vercel.json"
            else
              echo "✅ Frontend URL trouvée dans vercel.json"
            fi
          fi
          
          # Vérifier les fichiers critiques
          echo "🔍 Vérification des fichiers critiques..."
          CRITICAL_FILES=(
            "dist/server.js"
            "dist/routes/index.js"
            "dist/controllers/authController.js"
            "dist/models/User.js"
          )
          
          for file in "${CRITICAL_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file existe"
            else
              echo "❌ $file manquant"
            fi
          done
          
          # Vérifier la présence de scripts MongoDB
          if [ -d "dist/scripts/mongodb" ]; then
            echo "✅ Scripts MongoDB présents"
          else
            echo "⚠️ Scripts MongoDB manquants"
          fi
          
          # Résumé court
          echo "✅ Le build Vercel Backend est valide"
          
          # Générer un résumé pour l'artefact
          echo '# Rapport de build Vercel Backend' > vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo "**Date:** $(date)" >> vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo '## Structure' >> vercel-build-report.md
          echo '- dist: ✅' >> vercel-build-report.md
          echo "- api: $(if [ -d "api" ]; then echo "✅"; else echo "⚠️"; fi)" >> vercel-build-report.md
          echo "- vercel.json: $(if [ -f "vercel.json" ]; then echo "✅"; else echo "⚠️"; fi)" >> vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo '## Statistiques' >> vercel-build-report.md
          echo "- Taille totale: $TOTAL_SIZE" >> vercel-build-report.md
          echo "- Fichiers JS: $JS_COUNT" >> vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo '## Statut' >> vercel-build-report.md
          echo '**✅ PRÊT POUR DÉPLOIEMENT**' >> vercel-build-report.md
      
      - name: 📤 Uploader le rapport
        uses: actions/upload-artifact@v4
        with:
          name: vercel-backend-report
          path: backend/vercel-build-report.md
      
      - name: 🔍 Vérification des variables d'environnement
        working-directory: backend
        run: |
          echo "🔍 Vérification des variables d'environnement..."
          
          ENV_FOUND=false
          
          # Vérifier la présence de fichiers .env
          if [ -f ".env" ]; then
            echo "✅ .env trouvé"
            ENV_FOUND=true
          fi
          
          if [ -f ".env.example" ]; then
            echo "✅ .env.example trouvé"
          fi
          
          if [ "$ENV_FOUND" = false ]; then
            echo "⚠️ Aucun fichier .env trouvé"
            echo "🔄 Création d'un fichier .env de base pour production..."
            
            # Créer le fichier .env minimal pour production
            echo 'NODE_ENV=production' > .env
            echo 'APP_URL=https://nion-farr-backend.vercel.app' >> .env
            echo 'FRONTEND_URL=https://nion-farr.vercel.app' >> .env
            echo 'PORT=3001' >> .env
            echo 'CORS_ALLOWED_ORIGINS=https://nion-farr.vercel.app,https://nion-farr-backend.vercel.app' >> .env
            echo '# Ajoutez les variables MongoDB et d'autres variables sensibles' >> .env
            echo '# dans la console Vercel ou via les secrets GitHub' >> .env
            
            echo "✅ .env créé"
          fi
          
          echo "✅ Vérification terminée"
      
      - name: ✅ Notification finale
        run: |
          echo "✅ Build Vercel Backend vérifié avec succès"
          echo "🚀 Le backend est prêt pour déploiement sur Vercel"
          echo "📝 URL de déploiement: https://nion-farr-backend.vercel.app"

  deployment-verification:
    name: 🚀 Vérification de déploiement
    needs: [verify-vercel-backend]
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Notification de succès
        run: |
          echo "✅ Build vérifié et prêt pour déploiement sur Vercel"
          echo "🚀 URL du service: https://nion-farr-backend.vercel.app"
          echo "ℹ️ Le déploiement sera effectué par l'intégration GitHub de Vercel"
          
          # Note sur les variables d'environnement
          echo ""
          echo "⚠️ RAPPEL: Assurez-vous que les variables d'environnement suivantes sont configurées dans le dashboard Vercel:"
          echo "- MONGODB_URI"
          echo "- JWT_SECRET"
          echo "- JWT_REFRESH_SECRET"
          echo "- RESEND_API_KEY"
          echo "- CORS_ALLOWED_ORIGINS=https://nion-farr.vercel.app"
          echo "- VERCEL=1" 