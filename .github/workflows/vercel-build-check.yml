name: Vercel Frontend Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  # Permettre l'exécution manuelle depuis l'interface GitHub
  workflow_dispatch:

jobs:
  verify-vercel-build:
    name: 🌐 Vérification Frontend Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: 🛠️ Build Frontend
        working-directory: frontend
        run: |
          echo "🔨 Construction pour Vercel..."
          npm run build
          echo "✅ Build terminé"
      
      - name: 📊 Analyser le build
        working-directory: frontend
        run: |
          # Vérifier la structure du build
          if [ ! -d ".next" ] || [ ! -d ".next/static" ]; then
            echo "❌ Structure invalide du build"
            exit 1
          fi
          
          # Statistiques simples
          TOTAL_SIZE=$(du -sh .next | cut -f1)
          STATIC_SIZE=$(du -sh .next/static | cut -f1)
          JS_COUNT=$(find .next/static -name "*.js" | wc -l)
          CSS_COUNT=$(find .next/static -name "*.css" | wc -l)
          
          echo "📊 Statistiques du build:"
          echo "- Taille totale: $TOTAL_SIZE"
          echo "- Taille statique: $STATIC_SIZE"
          echo "- Fichiers JS: $JS_COUNT"
          echo "- Fichiers CSS: $CSS_COUNT"
          
          # Vérifier la présence de vercel.json
          if [ ! -f "vercel.json" ]; then
            echo "⚠️ vercel.json manquant"
            echo "Création d'un fichier vercel.json de base..."
            
            # Créer le fichier vercel.json ligne par ligne
            echo '{' > vercel.json
            echo '  "version": 2,' >> vercel.json
            echo '  "buildCommand": "npm run vercel-build",' >> vercel.json
            echo '  "framework": "nextjs",' >> vercel.json
            echo '  "installCommand": "npm install",' >> vercel.json
            echo '  "outputDirectory": ".next",' >> vercel.json
            echo '  "routes": [' >> vercel.json
            echo '    {' >> vercel.json 
            echo '      "src": "/api/(.*)",' >> vercel.json 
            echo '      "dest": "https://nion-farr-backend.vercel.app/api/$1"' >> vercel.json 
            echo '    },' >> vercel.json
            echo '    {' >> vercel.json 
            echo '      "src": "/(.*)",' >> vercel.json 
            echo '      "dest": "/$1"' >> vercel.json 
            echo '    }' >> vercel.json
            echo '  ],' >> vercel.json
            echo '  "rewrites": [' >> vercel.json
            echo '    {' >> vercel.json
            echo '      "source": "/api/:path*",' >> vercel.json
            echo '      "dest": "https://nion-farr-backend.vercel.app/api/$1"' >> vercel.json
            echo '    }' >> vercel.json
            echo '  ],' >> vercel.json
            echo '  "env": {' >> vercel.json
            echo '    "NEXT_PUBLIC_API_URL": "https://nion-farr-backend.vercel.app/api",' >> vercel.json
            echo '    "NEXT_PUBLIC_APP_URL": "https://nion-farr.vercel.app",' >> vercel.json
            echo '    "NEXT_PUBLIC_ENVIRONMENT": "production"' >> vercel.json
            echo '  }' >> vercel.json
            echo '}' >> vercel.json
            
            echo "✅ vercel.json créé"
          else
            # Vérifier les configurations clés
            if ! grep -q "nion-farr-backend.vercel.app" vercel.json; then
              echo "⚠️ Backend URL manquante dans vercel.json"
            else
              echo "✅ Backend URL trouvée dans vercel.json"
            fi
          fi
          
          # Résumé court
          echo "✅ Le build Vercel est valide"
          
          # Générer un résumé pour l'artefact
          echo '# Rapport de build Vercel Frontend' > vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo "**Date:** $(date)" >> vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo '## Structure' >> vercel-build-report.md
          echo '- .next: ✅' >> vercel-build-report.md
          echo '- .next/static: ✅' >> vercel-build-report.md
          echo "- vercel.json: $(if [ -f "vercel.json" ]; then echo "✅"; else echo "⚠️"; fi)" >> vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo '## Statistiques' >> vercel-build-report.md
          echo "- Taille totale: $TOTAL_SIZE" >> vercel-build-report.md
          echo "- Taille statique: $STATIC_SIZE" >> vercel-build-report.md
          echo "- Fichiers JS: $JS_COUNT" >> vercel-build-report.md
          echo "- Fichiers CSS: $CSS_COUNT" >> vercel-build-report.md
          echo '' >> vercel-build-report.md
          echo '## Statut' >> vercel-build-report.md
          echo '**✅ PRÊT POUR DÉPLOIEMENT**' >> vercel-build-report.md
      
      - name: 📤 Uploader le rapport
        uses: actions/upload-artifact@v4
        with:
          name: vercel-frontend-report
          path: frontend/vercel-build-report.md

      - name: 🔍 Vérification des variables d'environnement
        working-directory: frontend
        run: |
          echo "🔍 Vérification des variables d'environnement..."
          
          ENV_FOUND=false
          
          # Vérifier la présence de fichiers .env
          if [ -f ".env.production" ]; then
            echo "✅ .env.production trouvé"
            ENV_FOUND=true
            
            # Vérifier que les variables essentielles sont présentes
            if grep -q "NEXT_PUBLIC_API_URL" .env.production; then
              echo "✅ NEXT_PUBLIC_API_URL trouvé dans .env.production"
            else
              echo "⚠️ NEXT_PUBLIC_API_URL manquant dans .env.production"
            fi
          fi
          
          if [ -f ".env.example" ]; then
            echo "✅ .env.example trouvé"
          fi
          
          if [ "$ENV_FOUND" = false ]; then
            echo "⚠️ Aucun fichier .env.production trouvé"
            echo "🔄 Création d'un fichier .env.production de base..."
            
            # Créer le fichier .env.production
            echo 'NEXT_PUBLIC_API_URL=https://nion-farr-backend.vercel.app/api' > .env.production
            echo 'NEXT_PUBLIC_APP_URL=https://nion-farr.vercel.app' >> .env.production
            echo 'NEXT_PUBLIC_ENVIRONMENT=production' >> .env.production
            
            echo "✅ .env.production créé"
          fi
          
          echo "✅ Vérification terminée"

      - name: ✅ Notification finale
        run: |
          echo "✅ Build Vercel vérifié avec succès"
          echo "🚀 Le frontend est prêt pour déploiement sur Vercel"
          echo "📝 URL de déploiement: https://nion-farr.vercel.app" 