name: Vercel Build Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  # Permettre l'exécution manuelle depuis l'interface GitHub
  workflow_dispatch:

jobs:
  verify-vercel-build:
    name: 🌐 Vérification Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: 🛠️ Build Frontend
        working-directory: frontend
        run: |
          echo "🔨 Construction pour Vercel..."
          npm run build
          echo "✅ Build terminé"
      
      - name: 📊 Analyser le build
        working-directory: frontend
        run: |
          # Vérifier la structure du build
          if [ ! -d ".next" ] || [ ! -d ".next/static" ]; then
            echo "❌ Structure invalide du build"
            exit 1
          fi
          
          # Statistiques simples
          TOTAL_SIZE=$(du -sh .next | cut -f1)
          STATIC_SIZE=$(du -sh .next/static | cut -f1)
          JS_COUNT=$(find .next/static -name "*.js" | wc -l)
          CSS_COUNT=$(find .next/static -name "*.css" | wc -l)
          
          echo "📊 Statistiques du build:"
          echo "- Taille totale: $TOTAL_SIZE"
          echo "- Taille statique: $STATIC_SIZE"
          echo "- Fichiers JS: $JS_COUNT"
          echo "- Fichiers CSS: $CSS_COUNT"
          
          # Résumé court
          echo "✅ Le build Vercel est valide"
          
          # Générer un résumé pour l'artefact
          cat > vercel-build-report.md << EOL
          # Rapport de build Vercel
          
          **Date:** $(date)
          
          ## Structure
          - .next: ✅
          - .next/static: ✅
          
          ## Statistiques
          - Taille totale: $TOTAL_SIZE
          - Taille statique: $STATIC_SIZE
          - Fichiers JS: $JS_COUNT
          - Fichiers CSS: $CSS_COUNT
          
          ## Statut
          **✅ PRÊT POUR DÉPLOIEMENT**
          EOL
      
      - name: 📤 Uploader le rapport
        uses: actions/upload-artifact@v3
        with:
          name: vercel-build-report
          path: frontend/vercel-build-report.md

      - name: ✅ Notification finale
        run: |
          echo "✅ Build Vercel vérifié avec succès"
          echo "🚀 Le frontend est prêt pour déploiement sur Vercel" 