name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-frontend:
    name: 🌐 Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm install --no-audit --prefer-offline
      
      - name: 🧹 Lint & Test
        working-directory: frontend
        run: |
          echo "🔎 Vérification du code frontend..."
          npm run lint || echo "⚠️ Lint warnings trouvés"
          npm run test || echo "⚠️ Tests non bloquants échoués"
          echo "✅ Vérification terminée"
      
      - name: 🛠️ Build Frontend
        working-directory: frontend
        run: |
          npm run build
          echo "✅ Build frontend terminé"
      
      - name: 📊 Validation du build
        working-directory: frontend
        run: |
          # Vérifier la présence du répertoire .next
          if [ ! -d ".next" ] || [ ! -d ".next/static" ]; then
            echo "❌ Build invalide - structure .next incorrecte"
            exit 1
          fi
          
          # Statistiques du build
          echo "📊 Statistiques:"
          echo "- Taille totale: $(du -sh .next | cut -f1)"
          echo "- Fichiers JS: $(find .next -name "*.js" | wc -l)"
          echo "- Fichiers CSS: $(find .next -name "*.css" | wc -l)"
          echo "✅ Build frontend valide"

      - name: 🔄 Vérification de la configuration Vercel
        working-directory: frontend
        run: |
          echo "🔍 Vérification de la configuration Vercel..."
          
          if [ ! -f "vercel.json" ]; then
            echo "❌ vercel.json manquant"
            exit 1
          fi
          
          # Vérifier que vercel.json contient les bonnes configurations
          if ! grep -q "nionfar-backend.onrender.com" vercel.json; then
            echo "⚠️ URL du backend manquante dans vercel.json"
          else
            echo "✅ URL du backend trouvée dans vercel.json"
          fi
          
          echo "✅ Configuration Vercel validée"

  verify-backend:
    name: 🔧 Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: 📦 Install dependencies
        working-directory: backend
        run: npm install --no-audit --prefer-offline
      
      - name: 🛠️ Build Backend
        working-directory: backend
        run: |
          npm run build
          echo "✅ Build backend terminé"
      
      - name: 📂 Vérification de la structure Render
        run: |
          echo "🔍 Vérification de la configuration Render..."
          
          # Vérifier les fichiers critiques
          if [ ! -f "backend/render.yaml" ]; then
            echo "⚠️ backend/render.yaml manquant"
          else
            echo "✅ backend/render.yaml existe"
          fi
          
          # Vérifier que le fichier .env.production existe
          if [ ! -f "backend/.env.production" ]; then
            echo "❌ Fichier .env.production manquant"
          else
            echo "✅ Fichier .env.production existe"
          fi
          
          echo "✅ Configuration Render validée"
      
      - name: 🧪 Vérification MongoDB
        working-directory: backend
        run: |
          # Vérifier les scripts MongoDB essentiels
          MONGODB_SCRIPTS=("scripts/audit-mongodb-data.js" "scripts/schedule-mongodb-audit.js")
          
          for script in "${MONGODB_SCRIPTS[@]}"; do
            if [ -f "$script" ]; then
              echo "✅ $script existe"
              # Vérifier la syntaxe
              node -c "$script" && echo "  ✓ Syntaxe valide" || echo "  ⚠️ Syntaxe invalide"
            fi
          done
          
          echo "✅ Scripts MongoDB vérifiés"

  deploy-summary:
    name: 🚀 Informations de déploiement
    needs: [verify-frontend, verify-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Récapitulatif du déploiement
        run: |
          echo "✅ Vérifications réussies!"
          echo ""
          echo "🔄 Informations de déploiement:"
          echo "🌐 Frontend: https://nion-farr.vercel.app"
          echo "⚡ Backend: https://nionfar-backend.onrender.com"
          echo ""
          echo "📝 Note: Les déploiements sont gérés automatiquement par l'intégration GitHub avec Vercel et Render."
          echo "Les builds de cette action CI ne sont que des vérifications de conformité." 