name: Vercel Build Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Permettre l'exécution manuelle depuis l'interface GitHub
  workflow_dispatch:

jobs:
  wait-for-checks:
    name: 🕒 Attente des vérifications
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
      
      - name: ⌛ Attente des vérifications frontend
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.sha }}
          check-name: '🌐 Frontend Build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      
      - name: ⌛ Attente des vérifications backend
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.sha }}
          check-name: '🔧 Backend Build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          
      - name: ✅ Notification finale
        if: success()
        run: |
          echo "✅ Toutes les vérifications ont été complétées avec succès"
          echo "🚀 Les projets sont prêts pour un déploiement automatique via Vercel"
          echo "🔗 URLs de déploiement:"
          echo "   - Frontend: https://nion-farr.vercel.app"
          echo "   - Backend: https://nion-farr-backend.vercel.app" 