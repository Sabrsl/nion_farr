services:
  - type: web
    name: nionfar-backend
    env: node
    rootDir: backend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Configure this in Render dashboard
      - key: APP_URL
        fromService:
          name: nionfar-backend
          type: web
          property: url
      - key: FRONTEND_URL
        value: https://nion-farr.vercel.app
      - key: PORT
        value: 3001
      - key: IS_RENDER
        value: true
    autoDeploy: true
    plan: free # Vous pouvez modifier vers un plan payant si nécessaire 